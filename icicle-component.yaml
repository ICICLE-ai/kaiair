# ICICLE CI component definition for KaiAir, following the CI-Components-Catalog schema
# (https://github.com/ICICLE-ai/CI-Components-Catalog, ci-component.yaml / ci-component-schema.json).
# Fields marked TBD are settled with the ICICLE Release Team when the repository is created.
component:
  name: KaiAir
  description: >
    Predictable per-packet reliability for 5G RAN: PktR per-packet transmission power
    control (Cantelli bound), GRK interference modeling and K-adaptation, and multi-cell
    interference coordination (receiver-centric exclusion regions, ONAMA slot scheduling,
    Xn-AP inter-gNB signaling) implemented in the OCUDU 5G stack, with a companion OAI
    nrUE patch set, an HTTP control agent, and a live dashboard. Validated on the ARA
    wireless testbed with USRP radios.
  owner: Center for Wireless, Communities and Innovation (WiCI), Iowa State University
  status: AlphaRelease            # reliable, unit-tested, documented, APIs may still evolve
  primaryThrust: TBD              # Wireless or Software
  targetIcicleRelease: TBD
  website: TBD                    # ICICLE repo URL once created
  sourceCodeUrl: TBD              # https://github.com/ICICLE-ai/kaiair
  componentVersion: "1.0.0"
  licenseUrl: TBD                 # <repo>/blob/main/LICENSE (BSD 3-Clause)
  releaseNotesUrl: TBD            # <repo>/blob/main/CHANGELOG.md
  doi: ""
  citation: TBD                   # PktR / PRKS / LDP-TR papers + KaiAir report
  artifactOther: patch series against pinned OCUDU and OAI upstreams
  codeReviewConducted: false      # planned before BetaRelease
  testsWritten: true              # 12 gtest suites (ctest -R pktr)
  securityReviewConducted: false
  biasAssessmentConducted: false
  usageDocumentationAvailable: true
  usageDocumentationUrl: docs/BUILD_RUN.md, docs/AGENT_API.md
  developerDocumentationAvailable: true
  developerDocumentationUrl: docs/ARCHITECTURE.md
  trainingTutorialsAvailable: false
  publicAccess: true
  usageMetricsCollected: false
