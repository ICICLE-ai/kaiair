# KaiAir multi-cell gNB example, cell 1 of 3 (pci 7, gnb_id 411, PLMN 00101/TAC1).
# All cells share the same carrier and SSB frequency (full co-channel reuse, here
# dl_arfcn 638004 with SSB at 637056). Give each cell its own pci and gnb_id, list the
# other cells as neighbors, and point the xnap connections at the peer CU-CPs.
gnb_id: 411

cu_cp:
  amf:
    addrs: <IP>
    bind_addrs: <IP>
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 0x1
  inactivity_timer: 7200
  mobility:
    trigger_handover_from_measurements: false
    cells:
      - nr_cell_id: 0x66C000
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x670000
            report_configs: [2]
          - nr_cell_id: 0x674000
            report_configs: [2]
      - nr_cell_id: 0x670000
        pci: 2
        band: 78
        ssb_arfcn: 637056
        ssb_scs: 30
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 5
      - nr_cell_id: 0x674000
        pci: 3
        band: 78
        ssb_arfcn: 637056
        ssb_scs: 30
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 5
    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 480
        periodic_ho_rsrp_offset_db: -1
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: -15
        hysteresis_db: 0
        time_to_trigger_ms: 0
        report_interval_ms: 480
  xnap:
    procedure_timeout: 1000
    reconnect_timer: 1000
    connections:
      - bind_addrs: [<IP>]
        peer_addrs: [<IP>]
      - bind_addrs: [<IP>]
        peer_addrs: [<IP>]

ru_sdr:
  device_driver: uhd
  device_args: type=x300,serial=<SERIAL>
  clock: external
  sync: external
  srate: 46.08
  tx_gain: 14
  rx_gain: 30

expert_phy:
  pusch_sinr_calc_method: channel_estimator

cell_cfg:
  dl_arfcn: 638004
  band: 78
  channel_bandwidth_MHz: 40
  common_scs: 30
  plmn: "00101"
  tac: 1
  pci: 7
  ssb:
    ssb_block_power_dbm: 16
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 5
    nof_dl_slots: 3
    nof_dl_symbols: 6
    nof_ul_slots: 1
    nof_ul_symbols: 4
  pdsch:
    min_ue_mcs: 0
    max_ue_mcs: 14
  pusch:
    enable_cl_loop_pw_control: true
    p0_nominal_with_grant: -112
    max_rb_size: 25

log:
  filename: /tmp/gnb.log
  all_level: info
  hex_max_size: 0
  phy_level: debug
  xnap_level: info

pcap:
  mac_enable: false
